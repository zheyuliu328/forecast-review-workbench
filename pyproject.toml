[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "forecast-review-workbench"
version = "0.1.0"
description = "A local browser tool for reviewing supplied forecast files on a common evaluation sample"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["openpyxl>=3.1.5,<4", "defusedxml>=0.7,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff==0.16.6", "build>=1,<2", "pip-audit>=2,<3"]

[project.scripts]
forecast-review = "forecast_review_workbench.server:main"

[project.urls]
Homepage = "https://github.com/zheyuliu328/forecast-review-workbench"

[tool.hatch.build.targets.wheel]
packages = ["src/forecast_review_workbench"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
